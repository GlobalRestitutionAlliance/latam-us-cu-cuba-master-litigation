id: sovereign-tobacco-vegas-and-factory-disgorgement
name: Sovereign Tobacco Vegas & Factory Disgorgement
description: Operational protocols for Title III Helms-Burton actions (22 U.S.C. § 6082) and commercial receivables disgorgement against sovereign tobacco cultivation monopolies (Tabacuba OSDE, Empresa de Acopio y Beneficio de Tabaco) and historic expropriated cigar rolling palaces.
version: 1.0.0
tactical_domain: Tobacco Latifundia Disgorgement, Title III Cigar Factory Claims & Historic Brand Restitution
execution_protocol:
  - Step 1: Mapping expropriated Vuelta Abajo tobacco vegas (San Juan y Martínez, San Luis), curing barns, and landmark Havana cigar rolling factories against modern Tabacuba production combines.
  - Step 2: Establishing the commercial activity exception under 28 U.S.C. § 1605(a)(2) for all commercial tobacco processing, hand-rolling, and wholesale distribution activities conducted in hard currency.
  - Step 3: Proving alter ego liability between Tabacuba OSDE, Habanos S.A., MINAL, and GAESA under Bancec and 28 U.S.C. § 1610(g).
  - Step 4: Serving Rule 69 writs of execution and third-party garnishee notices on multinational joint-venture partners (Allied Cigar Corporation, Imperial Brands successors) and European dividend payment rails.
  - Step 5: Directing disgorged joint-venture profits, commercial cigar royalties, and wholesale proceeds into the Master Restitution Escrow.
operational_mandate: Execute comprehensive disgorgement actions across all Cuban commercial tobacco plantations, curing centers, and cigar rolling palaces.
