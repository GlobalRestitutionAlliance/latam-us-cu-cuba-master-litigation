skill:
  id: "locomotive-procurement-and-export-credit-garnishment"
  name: "Locomotive Supply Procurement, Export Credit & In Rem Maritime Equipment Arrest"
  description: "Cross-border post-judgment garnishment and in rem admiralty arrest protocol targeting Russian (Sinara / Transmashholding) and Chinese (CRRC) locomotive supply credits, letters of credit, EXIAR export guarantees, and imported rolling stock in transit under Supplemental Admiralty Rule C, Fed. R. Civ. P. 69, and N.Y. C.P.L.R. § 5225."
  category: "locomotive-garnishment"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Trace export credit clearing accounts, letter-of-credit facilities, and bank escrows financing Russian Sinara TGM8KM locomotives and Chinese CRRC passenger cars for UFC."
    - "Issue in rem admiralty arrest warrants under Supplemental Admiralty Rule C against imported diesel locomotives, bogies, and traction motors in Caribbean transshipment ports."
    - "Serve restraining notices and third-party turnover subpoenas on intermediary banks, export insurers, and factoring houses handling UFC equipment installment payments."
    - "Garnish commercial demurrage escrows, intermodal container leases, and freight transit receivables held by international forwarders."
