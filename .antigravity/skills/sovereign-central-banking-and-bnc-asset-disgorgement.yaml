skill:
  id: "sovereign-central-banking-and-bnc-asset-disgorgement"
  name: "Sovereign Commercial Banking Monopolies, BCC/BNC Asset Unbundling & Central Bank Reserve Disgorgement"
  description: "Procedural framework for unbundling and attaching commercial and liquid sovereign reserves held by Banco Central de Cuba (BCC) and Banco Nacional de Cuba (BNC) under FSIA § 1605(a)(2), § 1610(a)(2), § 1610(g), and Bancec alter ego doctrines."
  category: "sovereign-asset-recovery"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Differentiate sovereign central banking immune functions from commercial trading activities of BCC and BNC under 28 U.S.C. § 1611(b)(1) exceptions."
    - "Trace chain of confiscation under Law 891 (October 13, 1960) dissolving private commercial banks and transferring assets to BNC against certified FCSC claims (Citibank CU-2615, Chase CU-0251, Bank of Boston CU-0252)."
    - "Establish alter ego unity between the Republic of Cuba and BNC under First National City Bank v. Bancec (462 U.S. 611) and English High Court precedent in CRF I Ltd. v. Banco Nacional de Cuba ([2023] EWHC 80 (Comm))."
    - "Draft and file motions for turnover of unallocated commercial balances, foreign exchange reserves, and precious metal holdings located in third-party foreign jurisdictions."
