skill:
  id: "sovereign-medical-labor-export-and-csmc-disgorgement"
  name: "Sovereign Medical Labor Export Monopoly, CSMC S.A. Disgorgement & Contract Auditing"
  description: "Forensic audit and asset disgorgement protocol targeting sovereign commercial healthcare labor export monopolies (Comercializadora de Servicios Médicos Cubanos S.A. - CSMC S.A., MINSAP), bilateral host government service contracts, and commercial clinic networks under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego principles."
  category: "medical-labor-export-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, the Ministry of Public Health (MINSAP), and commercial labor export monopoly CSMC S.A. under First National City Bank v. Bancec."
    - "Audit bilateral health service agreements and commercial revenue streams generated by selling medical labor to foreign host governments across Latin America, the Caribbean, Africa, and Europe."
    - "Trace foreign currency payment sweeps and salary deduction accounts through Banco Central de Cuba, Banco Financiero Internacional (BFI), and offshore correspondent bank rails."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and federal receivership over CSMC S.A. accounts receivable, medical tourism facilities, and international billing conduits."
