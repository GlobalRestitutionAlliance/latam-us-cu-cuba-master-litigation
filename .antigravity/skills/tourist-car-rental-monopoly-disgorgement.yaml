id: tourist-car-rental-monopoly-disgorgement
name: Tourist Car Rental Monopoly & Commercial Fleet Disgorgement
description: Operational protocols for Title III Helms-Burton actions (22 U.S.C. § 6082) and commercial receivables disgorgement against sovereign vehicle rental monopolies (Transtur S.A., REX, Havanautos, Cubacar, Transgaviota), international booking engines, and offshore merchant acquiring accounts.
version: 1.0.0
tactical_domain: Car Rental Monopoly Disgorgement, Title III Helms-Burton Fleet Claims & Tourist Tariff Attachment
execution_protocol:
  - Step 1: Mapping expropriated American automotive dealerships, maintenance garages, and municipal transport concessions against modern Transtur and Transgaviota depot footprints.
  - Step 2: Establishing the commercial activity exception under 28 U.S.C. § 1605(a)(2) for all tourist vehicle leases, mandatory insurance surcharges, and fuel deposit fees charged in hard currency.
  - Step 3: Proving alter ego liability between Transtur S.A., Transgaviota, MINTUR, and GAESA under Bancec and 28 U.S.C. § 1610(g).
  - Step 4: Serving Rule 69 writs of execution and garnishee notices on transnational travel consolidators, online booking engines, and credit card settlement processors.
  - Step 5: Directing disgorged vehicle rental revenues, security deposit floats, and fleet concession fees into the Master Restitution Escrow.
operational_mandate: Execute comprehensive disgorgement actions across all Cuban commercial car rental networks and tourist transportation fleets.
