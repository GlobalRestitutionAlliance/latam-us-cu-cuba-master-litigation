id: transshipment-logistics-veil-piercing
name: ZED Mariel & ASPORT Sovereign Logistics Veil Piercing & Asset Forfeiture
description: Strategic doctrines for piercing the corporate veil between GAESA, ASPORT, TC Mariel S.A., and foreign joint venture holding companies under Bancec and federal common law alter ego standards.
version: 1.0.0
tactical_domain: Sovereign Maritime Logistics Corporate Veil Annihilation
execution_protocol:
  - Step 1: Mapping corporate shareholding structures of Terminal de Contenedores de Mariel S.A., ASPORT, and offshore intermediary holding entities.
  - Step 2: Uncovering commingling of commercial port revenues with GAESA military holding accounts and Banco Nacional de Cuba treasuries.
  - Step 3: Compiling evidentiary proof of sovereign control, lack of separate corporate capitalization, and state direction of port tariffs.
  - Step 4: Formulating Bancec alter ego motions under First National City Bank v. Bancec (462 U.S. 611) and Rubin v. Islamic Republic of Iran.
  - Step 5: Obtaining judicial decrees declaring all port infrastructure, crane assets, and concession revenues as unshielded property of the sovereign state.
statutory_authorities:
  - 28 U.S.C. § 1610(g) (Statutory veil piercing against foreign state instrumentalities)
  - First National City Bank v. Banco Para El Comercio Exterior de Cuba (Bancec), 462 U.S. 611 (1983)
  - Rubin v. Islamic Republic of Iran, 138 S. Ct. 816 (2018)
  - Federal Rule of Civil Procedure 64 (Seizure of Person or Property)
  - 28 U.S.C. § 1605(a)(2) (Commercial Activity Exception)
verified_by: agent-port-concessions-auditor
status: READY
