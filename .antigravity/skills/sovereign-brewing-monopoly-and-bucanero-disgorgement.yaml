skill:
  id: "sovereign-brewing-monopoly-and-bucanero-disgorgement"
  name: "Sovereign Commercial Brewing Monopolies, Bucanero Infrastructure & Distribution Disgorgement"
  description: "Forensic audit and asset disgorgement protocol targeting state-controlled commercial brewing monopolies (Cervecería Bucanero S.A., Corporación Alimentaria S.A. - Coralsa, and MINAL), industrial brewing assets, and domestic distribution channels under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego principles."
  category: "brewing-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Ministry of Food Industry (MINAL), Coralsa, and brewing monopoly Cervecería Bucanero S.A. under First National City Bank v. Bancec and Rubin v. Islamic Republic of Iran."
    - "Audit commercial cash flows, retail markups, and hard-currency revenues generated from monopoly beer sales (Cristal, Bucanero) across GAESA hotels and Tiendas MLC retail chains."
    - "Trace foreign currency payment sweeps from commercial beer sales into off-shore treasury accounts of Banco Financiero Internacional (BFI) and Banco Central de Cuba."
    - "Formulate motions for entry of post-judgment turnover orders, commercial charging orders, and appointment of an equity receiver over brewing proceeds and domestic distribution floats."
