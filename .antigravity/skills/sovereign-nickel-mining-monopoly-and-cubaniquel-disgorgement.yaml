skill:
  id: "sovereign-nickel-mining-monopoly-and-cubaniquel-disgorgement"
  name: "Sovereign Nickel Mining Monopoly, Cubaníquel Disgorgement & Concession Auditing"
  description: "Forensic audit and asset disgorgement protocol targeting sovereign commercial lateritic nickel and cobalt extraction monopolies (Grupo Empresarial Cubaníquel, Empresa Central de Níquel, MINEM), Pedro Sotto Alba (Moa) and Ernesto Che Guevara (Nicaro) complexes, and commercial mineral export revenues under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrines."
  category: "mining-monopoly-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MINEM, and Grupo Empresarial Cubaníquel under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial revenue streams and extraction royalties generated by the Pedro Sotto Alba (Moa) and Ernesto Che Guevara (Nicaro) nickel-cobalt processing complexes."
    - "Trace mineral export revenues through Banco Central de Cuba, Banco Financiero Internacional (BFI), and foreign correspondent banking channels."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and equity receivership over Cubaníquel commercial receivables and offshore mineral sales accounts."
