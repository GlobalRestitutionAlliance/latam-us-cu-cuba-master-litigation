skill:
  id: "melfi-marine-offshore-fleet-and-liner-disgorgement"
  name: "Melfi Marine Offshore Fleet, Liner Disgorgement & Maritime Alter Ego Auditing"
  description: "Forensic audit and asset disgorgement protocol targeting sovereign commercial maritime container shipping fleets (Melfi Marine Corp. S.A., Empresa de Navegación Caribe, MITRANS), time-charter agreements, and container leasing cashflows under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrines."
  category: "maritime-fleet-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MITRANS, and offshore front company Melfi Marine Corporation S.A. (Panama) under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial cashflows, freight manifests, and charter hire accounts generated by active container feeder lines connecting Mariel with Canadian and European ports."
    - "Trace ocean freight revenues and foreign exchange sweeps through Banco Central de Cuba, Banco Financiero Internacional (BFI), and foreign correspondent banks."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and judicial receivership over Melfi Marine commercial assets and offshore bank accounts."
