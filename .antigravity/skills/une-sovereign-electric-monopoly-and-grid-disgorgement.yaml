skill:
  id: "une-sovereign-electric-monopoly-and-grid-disgorgement"
  name: "Unión Eléctrica Sovereign Grid Disgorgement, Power Tariff Auditing & Bancec Alter Ego Forensics"
  description: "Forensic audit and asset disgorgement protocol targeting state commercial electric power monopolies (Unión Eléctrica - UNE, MINEM), national high-voltage transmission lines, and industrial tariff revenues under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrines."
  category: "electric-grid-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MINEM, and Unión Eléctrica (UNE) under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial power billing streams and hard-currency tariffs collected from privileged foreign enclaves (ZEDM, Moa Nickel, foreign diplomatic missions, international hotels)."
    - "Map dispatch load telemetry and transmission capacity crossing confiscated American & Foreign Power Company rights-of-way."
    - "Draft motions for entry of post-judgment turnover orders and judicial receivership over UNE commercial bank accounts and electricity clearing receivables."
