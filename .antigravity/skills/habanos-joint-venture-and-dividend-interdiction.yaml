skill:
  id: "habanos-joint-venture-and-dividend-interdiction"
  name: "Habanos Joint Venture & Dividend Interdiction"
  version: "1.0.0"
  status: "CERTIFIED"
  category: "Transnational Joint Venture Equity Execution & Dividend Garnishment"

description: >
  Operational and procedural protocol for attaching the 50% state-owned equity interest, annual dividend remittances,
  and corporate management distributions generated by Habanos S.A. through its transnational joint venture
  with Allied Cigar Corp / Tabacalera S.L.U. (Spain / Hong Kong).

execution_protocol:
  step_1: "Examine corporate registry records of Habanos S.A., Tabacalera S.L.U., and intermediate holding companies in Spain, Hong Kong, and Panama."
  step_2: "Serve charging orders, third-party debt orders, and Spanish embargos upon Tabacalera S.L.U. (Madrid) and holding company entities attaching dividend distributions payable to Cubatabaco."
  step_3: "Serve Fed. R. Civ. P. 69 writs and CPLR § 5222 restraining notices on international clearing banks processing annual profit dividends derived from global cigar sales."
  step_4: "Interdict joint venture distributions and direct proceeds into the Master Qualified Settlement Fund under judicial supervision."

authorities:
  - "28 U.S.C. § 1610(a)(2) & (b)(2) (Commercial Property Attachment and Execution)"
  - "Spanish Ley de Enjuiciamiento Civil (LEC) Art. 592 (Embargo de créditos y participaciones sociales)"
  - "N.Y. C.P.L.R. § 5222 (Restraining Notice upon Third-Party Garnishees)"
  - "English Civil Procedure Rules (CPR) Part 72 (Third-Party Debt Orders)"
  - "First National City Bank v. Bancec, 462 U.S. 611 (1983)"
