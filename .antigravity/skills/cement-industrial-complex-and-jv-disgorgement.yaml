tactical_domain: Heavy Industry Disgorgement, Title III Helms-Burton Enforcement & Industrial Veil Piercing
execution_protocol:
  - Step 1: Correlating expropriated cement plant titles and FCSC claims (Cuban Portland Cement, Lone Star) with modern kiln footprints.
