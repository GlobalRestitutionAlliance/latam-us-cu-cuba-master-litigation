  name: "Zero-Knowledge Fiduciary Execution & Shamir Vaults"
  version: "1.0.0"
  
  capabilities:
    - "Compile Circom circuits and Groth16 proving keys for anonymous class membership verification"
    - "Generate 256-bit Galois Field GF(2^8) Shamir polynomial key shards with threshold recovery"
