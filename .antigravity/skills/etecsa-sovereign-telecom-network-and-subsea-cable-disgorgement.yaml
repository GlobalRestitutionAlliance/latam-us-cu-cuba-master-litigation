skill:
  id: "etecsa-sovereign-telecom-network-and-subsea-cable-disgorgement"
  name: "ETECSA Sovereign Telecom Network, Subsea Cable Disgorgement & Alter Ego Auditing"
  description: "Forensic audit and asset disgorgement protocol targeting state commercial telecommunications monopolies (ETECSA, Cubacel, Nauta), subsea fiber-optic dark fiber concessions (ALBA-1, ARCOS-1 Cojímar landing station), and international IP transit revenues under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrines."
  category: "telecommunications-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MINCOM, and Empresa de Telecomunicaciones de Cuba S.A. (ETECSA) under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial voice, data, and mobile revenue streams generated by Cubacel cellular networks, Nauta public Wi-Fi hotspots, and domestic broadband infrastructure."
    - "Map dark fiber bandwidth allocations, co-location agreements, and IP transit routing traversing the ALBA-1 and ARCOS-1 subsea fiber cable landing facilities at Cojímar, Havana."
    - "Draft motions for judicial receivership and post-judgment turnover orders over ETECSA's commercial telecommunications assets and foreign exchange receivables."
