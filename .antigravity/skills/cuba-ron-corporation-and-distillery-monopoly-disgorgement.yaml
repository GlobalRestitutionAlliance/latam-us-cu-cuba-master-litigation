skill:
  id: "cuba-ron-corporation-and-distillery-monopoly-disgorgement"
  name: "Cuba Ron Corporation, Distillery Monopoly Disgorgement & Alter Ego Auditing"
  description: "Forensic audit and asset disgorgement protocol targeting sovereign commercial rum and spirits monopolies (Corporación Cuba Ron S.A., MINAL), operating distilleries (Santa Cruz del Norte, San José de las Lajas, Cárdenas, Santiago de Cuba), and commercial export revenues under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrines."
  category: "spirits-monopoly-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MINAL, and Corporación Cuba Ron S.A. under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial cashflows, aging barrel inventories, and operating reserves generated by active rum distilleries and bottling combines."
    - "Trace domestic spirits sales and foreign currency export sweeps through Banco Central de Cuba, Banco Financiero Internacional (BFI), and foreign correspondent accounts."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and judicial receivership over Cuba Ron commercial assets and domestic beverage operations."
