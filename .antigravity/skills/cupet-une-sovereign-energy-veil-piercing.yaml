id: cupet-une-sovereign-energy-veil-piercing
name: CUPET & Unión Eléctrica (UNE) Sovereign Energy Monopoly Veil Annihilation
description: Strategic doctrines for piercing the corporate veil between CUPET, UNE, GAESA, and the Ministry of Energy and Mines under Bancec and 28 U.S.C. § 1610(g) to capture sovereign crude and electrical receivables worldwide.
version: 1.0.0
tactical_domain: Sovereign Energy Monopoly Corporate Veil Annihilation
execution_protocol:
  - Step 1: Documenting complete structural, ministerial, and operational control of CUPET and UNE by the Cuban state.
  - Step 2: Compiling evidentiary proof of executive direction over fuel allocations, power outages, and state-subsidized barter arrangements.
  - Step 3: Demonstrating commingling of petroleum revenues with GAESA military holding accounts and central sovereign treasury reserves.
  - Step 4: Formulating Bancec alter ego motions under First National City Bank v. Bancec (462 U.S. 611) extinguishing separate corporate identity.
  - Step 5: Obtaining judicial decrees declaring all CUPET and UNE refinery assets, hydrocarbon concessions, and overseas accounts as unshielded property of the sovereign state.
statutory_authorities:
  - 28 U.S.C. § 1610(g) (Statutory Veil Piercing Against Foreign State Agencies and Instrumentalities)
