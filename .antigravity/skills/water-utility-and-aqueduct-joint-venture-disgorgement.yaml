id: water-utility-and-aqueduct-joint-venture-disgorgement
name: Water Utility & Municipal Aqueduct Joint-Venture Disgorgement
description: Operational protocols for Title III Helms-Burton actions (22 U.S.C. § 6082) and Bancec veil-piercing against multinational joint-venture partners (Agbar / Suez / Veolia) exploiting expropriated municipal aqueducts (Acueducto de Albear), water treatment plants, and urban distribution mains.
version: 1.0.0
tactical_domain: Municipal Utility Disgorgement, Title III Helms-Burton Enforcement & Public Infrastructure Veil Piercing
execution_protocol:
  - Step 1: Mapping expropriated municipal aqueducts, pumping stations, and water mains against modern Aguas de La Habana concession footprints.
  - Step 2: Proving commercial exploitation by foreign multinational operators under 28 U.S.C. § 1605(a)(2) and 22 U.S.C. § 6082.
  - Step 3: Establishing lack of corporate independence between INRH, Aguas de La Habana S.A., and the Cuban State under Bancec.
  - Step 4: Securing constructive trust and equitable accounting orders over overseas dividend distributions and technical management fees.
