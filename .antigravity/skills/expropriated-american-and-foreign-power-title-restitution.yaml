skill:
  id: "expropriated-american-and-foreign-power-title-restitution"
  name: "Expropriated American & Foreign Power Company Restitution, CCE Title Tracing & Title III Trafficking Actions"
  description: "Restitution and Title III trafficking enforcement framework targeting the uncompensated nationalization under Law 851 of American & Foreign Power Company / Cuban Electric Company (Compañía Cubana de Electricidad, FCSC Claim No. CU-2578, certified for $267.5M principal in 1969, now exceeding $40.0 Billion with 6% interest), generating statutory treble damages against foreign energy conglomerates under 22 U.S.C. § 6082."
  category: "electric-utility-restitution"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Formulate Helms-Burton Title III private rights of action (22 U.S.C. § 6082) against transnational energy corporations, generation equipment vendors, and fuel suppliers trafficking in confiscated CCE infrastructure."
    - "Calculate certified claim valuation incorporating statutory 6% annual simple interest on FCSC Claim No. CU-2578 ($267,568,413.62 principal taking in 1960 yielding an uncompensated balance exceeding $40.0 Billion)."
    - "Trace unbroken title and land boundaries of expropriated power generation sites (Tallapiedra, Regla, Cienfuegos, Hanabanilla Hydroelectric Dam) and national high-voltage transmission easements."
    - "Compile executive exclusion dossiers under Helms-Burton Title IV (22 U.S.C. § 6091) for transmission to the U.S. Department of State targeting corporate directors of trafficking foreign energy conglomerates."
