skill:
  id: "sovereign-airport-monopoly-and-ecasa-disgorgement"
  name: "Sovereign Commercial Airport Monopolies, ECASA Infrastructure & Concession Disgorgement"
  description: "Forensic audit and asset disgorgement protocol targeting state-controlled commercial civil airport monopolies (Empresa Cubana de Aeropuertos y Servicios Aeronáuticos S.A. - ECASA and Corporación de la Aviación Cubana S.A. - CACSA), passenger departure security fees ($25/passenger), and airport ramp concessions under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego principles."
  category: "civil-aviation-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish commercial alter ego unity between the Ministry of Transport (MITRANS), CACSA, and airport operator ECASA under First National City Bank v. Bancec and Rubin v. Islamic Republic of Iran."
    - "Trace chain of title for confiscated passenger terminal complexes, aircraft maintenance hangars, and flight operations facilities constructed by Pan American World Airways, Inc. (FCSC Claim No. CU-0415) at Rancho Boyeros (José Martí International Airport)."
    - "Audit commercial cash flows from passenger departure taxes, aircraft ground handling fees, passenger jetway boarding fees, and commercial airport concession leases."
    - "Formulate motions for post-judgment turnover orders, charging orders, and equitable receivership over commercial airport terminal revenues and third-party airline receivables."
