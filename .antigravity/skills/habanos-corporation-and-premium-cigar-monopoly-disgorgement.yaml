skill:
  id: "habanos-corporation-and-premium-cigar-monopoly-disgorgement"
  name: "Corporación Habanos S.A. Premium Cigar Monopoly Disgorgement & Commercial Veil-Piercing Forensics"
  description: "Forensic audit and asset disgorgement protocol targeting state commercial tobacco monopoly combines (TABACUBA, Corporación Habanos S.A., Allied Cigar Corporation), wholesale export revenues, and retail dollar store (Tiendas MLC) cashflows under FSIA § 1605(a)(2), § 1610(a)(2), and Bancec alter ego doctrines."
  category: "cigar-monopoly-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MINCEX, TABACUBA, and Corporación Habanos S.A. under First National City Bank v. Bancec (462 U.S. 611)."
    - "Forensically audit the 50/50 joint venture equity structure between TABACUBA and Allied Cigar Corporation (Hong Kong) acquired in 2020 for $1.44 Billion."
    - "Trace and interdict hard-currency cashflows from domestic luxury cigar boutiques (La Casa del Habano) and Tiendas MLC retail dollar networks."
    - "Draft motions for turnover orders and third-party citations under Fed. R. Civ. P. 69 and 28 U.S.C. § 1610(g) targeting foreign banking clearing floats of Habanos S.A."
