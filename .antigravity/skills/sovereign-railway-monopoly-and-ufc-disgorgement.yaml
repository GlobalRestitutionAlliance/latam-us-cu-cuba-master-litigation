skill:
  id: "sovereign-railway-monopoly-and-ufc-disgorgement"
  name: "Sovereign Commercial Railway Monopolies, UFC Infrastructure & Freight Tariff Disgorgement"
  description: "Forensic audit and asset disgorgement protocol targeting state-controlled commercial railway monopolies (Unión de Ferrocarriles de Cuba - UFC and MITRANS), industrial freight tariffs, and terminal concessions under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego principles."
  category: "railway-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Ministry of Transport (MITRANS) and railway monopoly Unión de Ferrocarriles de Cuba (UFC) under First National City Bank v. Bancec and Rubin v. Islamic Republic of Iran."
    - "Trace chain of title for confiscated 4,000+ mile mainline trackage, urban passenger stations, and freight yards nationalized under Law 890."
    - "Audit commercial cash flows from industrial freight contracts, including AZCUBA raw sugar bulk transport, Mariel container rail shuttles, and Moa nickel haulage."
    - "Formulate motions for entry of post-judgment turnover orders, commercial charging orders, and appointment of an equity receiver over UFC freight tariff clearing accounts."
