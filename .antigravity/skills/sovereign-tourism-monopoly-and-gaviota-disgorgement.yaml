skill:
  id: "sovereign-tourism-monopoly-and-gaviota-disgorgement"
  name: "Sovereign Commercial Tourism Monopolies, GAESA/Gaviota Asset Unbundling & Hospitality Disgorgement"
  description: "Procedural and forensic methodology for discovering, piercing, and disgorging commercial revenues and assets of state tourism holding companies (GAESA, Grupo de Turismo Gaviota S.A., Cubanacán, Gran Caribe) operating expropriated pre-1959 hotels under FSIA § 1605(a)(2) and Bancec alter ego standards."
  category: "sovereign-asset-recovery"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Cuban Ministry of the Revolutionary Armed Forces (MINFAR), GAESA military holding company, and Grupo de Turismo Gaviota S.A. under Bancec and Rubin v. Islamic Republic of Iran."
    - "Trace chain of title for confiscated pre-1959 hotel properties and prime beachfront parcels nationalized under Law 851 against FCSC certified claim records (Claim Nos. CU-0249, CU-1100, CU-2495)."
    - "Identify and map sovereign cash flow pipelines from foreign guest payment gateways, credit card processing escrows, and hard-currency resort accounts."
    - "Formulate motions for entry of turnover orders and appointment of equity receivers over state-controlled hospitality revenues and joint venture shares."
