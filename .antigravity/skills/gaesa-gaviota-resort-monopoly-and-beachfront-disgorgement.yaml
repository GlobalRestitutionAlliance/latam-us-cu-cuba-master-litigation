skill:
  id: "gaesa-gaviota-resort-monopoly-and-beachfront-disgorgement"
  name: "GAESA Gaviota Resort Monopoly Disgorgement, Beachfront Auditing & Bancec Alter Ego Forensics"
  description: "Forensic audit and asset disgorgement protocol targeting military-controlled tourism conglomerates (GAESA, Grupo de Turismo Gaviota S.A., Gran Caribe), beachfront resort concessions, and tourist foreign exchange flows under FSIA § 1605(a)(2), § 1610(a)(2), and Bancec alter ego doctrines."
  category: "resort-monopoly-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between MINFAR, GAESA, and Grupo de Turismo Gaviota S.A. under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial cashflows and foreign exchange remittances generated across 30,000+ luxury resort hotel rooms and beachfront villas."
    - "Trace and interdict hard-currency clearing flows from domestic tourist car rental networks (Transtur, Transgaviota, REX) and marina concessions."
    - "Draft motions for turnover orders and third-party citations under Fed. R. Civ. P. 69 and 28 U.S.C. § 1610(g) targeting foreign banking clearing floats of GAESA tourism subsidiaries."
