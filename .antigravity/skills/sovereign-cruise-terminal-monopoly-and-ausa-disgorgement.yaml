skill:
  id: "sovereign-cruise-terminal-monopoly-and-ausa-disgorgement"
  name: "Sovereign Commercial Maritime Passenger Port Monopolies, GAESA/AUSA Concession Unbundling & Terminal Revenue Disgorgement"
  description: "Procedural and forensic methodology for discovering, piercing, and disgorging commercial revenues and assets of state maritime passenger terminal monopolies (GAESA, Almacenes Universales S.A. / AUSA, Empresa de Servicios Portuarios de Occidente) operating expropriated pre-1959 piers under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego standards."
  category: "sovereign-asset-recovery"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Ministry of Transport (MITRANS), military holding conglomerate GAESA, and port terminal operator Almacenes Universales S.A. (AUSA) under Bancec and Rubin v. Islamic Republic of Iran."
    - "Trace chain of title for confiscated Havana Bay finger piers (San Francisco, La Machina, Santa Clara) nationalized under Law 851 against certified FCSC claim records (Claim No. CU-2492, Havana Docks Corporation)."
    - "Map hard-currency cash flow pipelines from passenger disembarkation levies, tugboat assistance tariffs, and terminal mooring fees."
    - "Formulate motions for entry of post-judgment turnover orders and appointment of equity receivers over state-controlled cruise terminal operating concessions."
