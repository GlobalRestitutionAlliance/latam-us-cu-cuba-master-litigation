skill:
  id: "azcuba-holding-and-sugar-agroindustrial-disgorgement"
  name: "AZCUBA Holding, Sugar Agro-Industrial Disgorgement & Corporate Auditing"
  description: "Forensic audit and asset disgorgement protocol targeting sovereign raw and refined sugar agro-industrial monopolies (Grupo Empresarial Agroazucarero - AZCUBA, Zerus S.A., MINAZ), operating centrales azucareros, cane plantations, and commercial byproduct distilleries under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrines."
  category: "sugar-monopoly-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, MINAZ, and Grupo Empresarial Agroazucarero (AZCUBA) under First National City Bank v. Bancec (462 U.S. 611)."
    - "Audit commercial cashflows, raw cane processing accounts, and operating reserves generated by active centrales azucareros and molasses distilleries."
    - "Trace domestic agricultural revenues and foreign exchange sweeps through Banco Central de Cuba, Banco Financiero Internacional (BFI), and foreign correspondent accounts."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and judicial receivership over AZCUBA commercial assets and sugar byproduct operations."
