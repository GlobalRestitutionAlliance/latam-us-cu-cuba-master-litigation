skill:
  id: "sovereign-hydrocarbon-monopoly-and-cupet-disgorgement"
  name: "Sovereign Commercial Petroleum Monopolies, CUPET/ECC Asset Unbundling & Oil Refining Disgorgement"
  description: "Procedural and forensic methodology for discovering, piercing, and disgorging commercial revenues and assets of state oil holding companies (Unión Cuba-Petróleo / CUPET, Empresa Comercializadora de Combustibles / ECC) operating expropriated pre-1959 American refineries under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego standards."
  category: "sovereign-asset-recovery"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Ministry of Energy and Mines (MINEM), CUPET, ECC, and retail marketing arm CIMEX under Bancec and Rubin v. Islamic Republic of Iran."
    - "Trace chain of title for confiscated American oil refineries nationalized under Law 851 against FCSC certified claim records (Claim No. CU-0064, Esso Standard Oil S.A.; Claim No. CU-0065, Texaco Inc.)."
    - "Map commercial cash flow pipelines from domestic hard-currency service station networks (Servicupet, CIMEX Oro Negro) and wholesale fuel distribution contracts."
    - "Formulate motions for entry of turnover orders and appointment of equity receivers over state-controlled oil refining infrastructure, tank farms, and pipeline networks."
