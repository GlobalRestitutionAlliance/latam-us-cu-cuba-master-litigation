skill:
  id: "sovereign-commercial-retail-monopoly-and-cimex-disgorgement"
  name: "Sovereign Commercial Retail Monopolies, Hard-Currency Tiendas MLC & CIMEX Disgorgement"
  description: "Forensic audit and asset recovery methodology targeting state-controlled commercial retail monopolies (Corporación CIMEX S.A., Cadena de Tiendas Panamericanas, Tiendas Caribe / TRD) operating hard-currency retail networks (Tiendas MLC) under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego doctrine."
  category: "sovereign-asset-recovery"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the GAESA military holding apparatus and Corporación CIMEX S.A. under First National City Bank v. Bancec and Exxon Mobil Corp. v. Corporación CIMEX S.A. precedents."
    - "Audit commercial cash flows, retail markups, and hard-currency (MLC) revenues generated across Cadena de Tiendas Panamericanas and Tiendas Caribe."
    - "Trace foreign currency payment sweeps from dollar-denominated retail sales into off-shore treasury accounts of Banco Financiero Internacional (BFI) and Banco Nacional de Cuba (BNC)."
    - "Formulate judicial turnover motions and receiver applications targeting commercial retail proceeds and receivables across international clearing houses."
