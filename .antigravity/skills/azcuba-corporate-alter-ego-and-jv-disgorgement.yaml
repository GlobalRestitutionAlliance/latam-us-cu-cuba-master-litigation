id: azcuba-corporate-alter-ego-and-jv-disgorgement
name: AZCUBA Corporate Alter Ego & Biomass Energy Joint-Venture Disgorgement
description: Operational protocols for piercing the corporate veil of Grupo Azucarero AZCUBA and its foreign holding affiliate Zerus S.A., establishing sovereign alter-ego identity under First National City Bank v. Banco Para El Comercio Exterior de Cuba (Bancec), and disgorging commercial revenues and equity from foreign joint ventures (Biopower S.A., Havana Energy, Shanghai Electric) exploiting expropriated sugar mill lands under Title III of the LIBERTAD Act.
version: 1.0.0
tactical_domain: Agro-Industrial Veil Piercing, Biomass Energy Concession Disgorgement & Title III Helms-Burton Litigation
execution_protocol:
  - Step 1: Mapping expropriated sugar mill boundaries, cane fields, and bagasse supply chains against active AZCUBA centrales and biomass co-generation plants.
  - Step 2: Applying Bancec factor analysis proving complete sovereign day-to-day command, ministerial direction by MINAL/Council of Ministers, and absence of independent corporate capitalization.
  - Step 3: Initiating 22 U.S.C. § 6082 Title III actions against foreign engineering contractors, financiers, and equity partners trafficking in confiscated sugar estate properties.
  - Step 4: Securing constructive trust and equitable disgorgement decrees over foreign joint-venture dividend streams, green energy credits, and turbine lease revenues.
