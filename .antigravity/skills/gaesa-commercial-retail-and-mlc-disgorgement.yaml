id: gaesa-commercial-retail-and-mlc-disgorgement
name: GAESA Commercial Retail & Tiendas MLC Disgorgement
description: Operational protocols for piercing the corporate veil of Corporación CIMEX S.A., TRD Caribe, and Tiendas Caracol, establishing agency and alter-ego identity with GAESA and the Cuban State under 28 U.S.C. § 1610(g), and disgorging commercial revenues and monopolistic markups derived from captive retail dollar stores (Tiendas MLC).
version: 1.0.0
tactical_domain: Retail Monopoly Veil Piercing, Commercial Real Estate Disgorgement & Restitution Accounting
execution_protocol:
  - Step 1: Mapping expropriated department store locations and commercial real estate parcels against current CIMEX and TRD retail outlets.
  - Step 2: Applying Bancec factor analysis proving complete GAESA/MINFAR military ownership, centralized executive command, and lack of corporate independence.
  - Step 3: Quantifying unjust enrichment under Restatement (Third) of Restitution § 51 for coercive markups (200%-500%) imposed on basic necessities.
  - Step 4: Securing federal post-judgment turnover orders attaching domestic and foreign commercial banking deposits.
