id: csmc-commercial-healthcare-and-clinic-disgorgement
name: CSMC Commercial Healthcare & Specialized Clinic Disgorgement
description: Operational protocols for establishing commercial activity under 28 U.S.C. § 1605(a)(2) and Bancec veil-piercing of Comercializadora de Servicios Médicos Cubanos, S.A. (CSMC) and MINSAP commercial subsidiaries under 28 U.S.C. § 1610(g), disgorging private health tourism revenues under Restatement (Third) of Restitution § 51.
version: 1.0.0
tactical_domain: Commercial Activity Exception, Sovereign Health Monopoly Veil Piercing & Healthcare Disgorgement
execution_protocol:
  - Step 1: Mapping expropriated private properties and diplomatic mansions occupied by Clínica Cira García, CIREN, and La Pradera.
  - Step 2: Proving commercial character under 28 U.S.C. § 1605(a)(2) based on private, market-rate consumer healthcare contracts.
  - Step 3: Establishing lack of corporate independence between CSMC, S.A. and the Cuban Ministry of Public Health.
  - Step 4: Securing federal post-judgment turnover orders attaching domestic and foreign commercial banking deposits.
