skill:
  id: "sovereign-deepwater-port-monopoly-and-zedm-disgorgement"
  name: "Sovereign Commercial Megaport Monopolies, ZEDM Free Zone Asset Unbundling & Terminal Revenue Disgorgement"
  description: "Procedural and forensic methodology for discovering, piercing, and disgorging commercial revenues and assets of state deepwater container port monopolies, Zona Especial de Desarrollo Mariel (ZEDM), and TCM S.A. operating on expropriated pre-1959 docks and latifundia under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego standards."
  category: "sovereign-asset-recovery"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Ministry of Transport (MITRANS), military holding company GAESA, port operator Almacenes Universales S.A. (AUSA), and TCM S.A. under Bancec and Rubin v. Islamic Republic of Iran."
    - "Trace chain of title for confiscated Mariel Bay waterfront acreage, piers, and maritime latifundia against certified FCSC claim records (Claim Nos. CU-2492 and CU-0498, Blanco Rosell / Carranza-Ambrose estate)."
    - "Map hard-currency cash flow pipelines from foreign shipping lines, customs-free zone manufacturing leaseholders, and terminal concessionaires."
    - "Formulate motions for entry of post-judgment turnover orders and appointment of equity receivers over state-controlled container terminal shares and maritime handling revenues."
