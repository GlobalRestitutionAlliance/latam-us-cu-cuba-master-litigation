skill:
  id: "expropriated-historic-hotel-and-coastal-latifundia-restitution"
  name: "Expropriated Historic Hotel Properties, Coastal Latifundia & Title III Restitution Protocol"
  description: "Procedural protocol for asserting certified property claims under Law 851 & Law 890, FCSC Claim Nos. CU-2495 (Sanchez-Hill / Central Santa Lucía & Playa Esmeralda) and CU-0249 (Hotel Habana Riviera), and Helms-Burton Title III (22 U.S.C. § 6082) against commercial traffickers in confiscated beachfront real estate and historic luxury hotels."
  category: "hotel-latifundia-restitution"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Trace chain of title and certified confiscation records under Law 851 and Law 890 for landmark beachfront tracts (Playa Esmeralda, Varadero) and historic hotels (Habana Riviera, Nacional, Habana Libre)."
    - "Synthesize certified awards from FCSC Claim Nos. CU-2495 and CU-0249 with 6% annual statutory interest into enforceable federal judgments."
    - "Draft Helms-Burton Title III complaints for statutory treble damages (22 U.S.C. § 6082) against transnational hotel chains and booking engines trafficking in confiscated real estate."
    - "Compile Title IV Sanctions Dossiers under 22 U.S.C. § 6091 for submission to the U.S. Department of State to enforce executive visa exclusions against controlling hotel executives."
