skill:
  id: "core-jurisprudential-pillars-and-precedent-hardening"
  name: "Core Jurisprudential Pillars & Precedent Hardening"
  version: "1.0.0"
  status: "CERTIFIED"
  category: "Master Jurisprudential Doctrine & Constitutional-Statutory Precedent Hardening"

description: >
  Comprehensive methodology for synthesizing and weaponizing the foundational jurisprudential pillars of sovereign fiduciary duty,
  continuing state responsibility under customary international law, sovereign alter ego veil piercing, and Helms-Burton Title III fee-simple ownership.
  The protocol inoculates pleadings against sovereign immunity, political question doctrine, statute of limitations, and concession-expiration defenses.

execution_protocol:
  step_1: "Establish managerial and operational dominion over expropriated assets under United States v. Mitchell (463 U.S. 206) and United States v. White Mountain Apache Tribe (537 U.S. 465), demonstrating an enforceable common-law constructive trust and waiver of sovereign immunity for fiduciary breach."
  step_2: "Document unbroken continuous delictual character under ILC ARSIWA Articles 14(2), 14(3), and 28-31, establishing that uncompensated sovereign expropriation and continuous exploitation constitute an ongoing violation of international law with perpetual non-prescription."
  step_3: "Apply First National City Bank v. Bancec (462 U.S. 611) disjunctive standards and 28 U.S.C. § 1610(g) to collapse corporate separateness between the Republic of Cuba and its military/commercial instruments (GAESA, CIMEX, Gaviota, Almest, CDC, BCC, Havin Bank)."
  step_4: "Fortify fee-simple title records under Helms-Burton Title III (22 U.S.C. § 6082), distinguishing perpetual underlying ownership rights from limited-term concessions to bypass 11th Circuit expiration exceptions under Havana Docks Corp. v. Royal Caribbean Cruises, Ltd. (104 F.4th 1243)."
  step_5: "Calculate 66-year statutory interest compounding at 6% simple annual interest under 22 U.S.C. § 1643l and apply automatic treble damages under 22 U.S.C. § 6082(a)(3)."

authorities:
  - "United States v. Mitchell, 463 U.S. 206 (1983)"
  - "United States v. White Mountain Apache Tribe, 537 U.S. 465 (2003)"
  - "ILC Draft Articles on State Responsibility (ARSIWA) Arts. 14(2), 14(3), 28-31"
  - "First National City Bank v. Banco Para El Comercio Exterior de Cuba (Bancec), 462 U.S. 611 (1983)"
  - "28 U.S.C. § 1610(a)(2), (a)(3), and § 1610(g)"
  - "22 U.S.C. § 6082 (Cuban LIBERTAD Act Title III)"
  - "Havana Docks Corp. v. Royal Caribbean Cruises, Ltd., 104 F.4th 1243 (11th Cir. 2024)"
