skill:
  id: "sovereign-food-monopoly-and-alimport-disgorgement"
  name: "Sovereign Food Import Monopolies, ALIMPORT Procurement & Supply Concession Disgorgement"
  description: "Forensic audit and asset disgorgement protocol targeting state-controlled commercial food import monopolies (Empresa Cubana Importadora de Alimentos - ALIMPORT, MINCEX, and Coralsa), bulk commodity purchasing quotas, and wholesale supply concessions under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego principles."
  category: "food-import-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Ministry of Foreign Trade (MINCEX) and food import monopoly ALIMPORT under First National City Bank v. Bancec and Rubin v. Islamic Republic of Iran."
    - "Audit commercial cash flows, wholesale markups, and foreign currency revenues generated from ALIMPORT supplying GAESA tourist hotels (ITH S.A.) and Tiendas MLC supermarkets."
    - "Trace foreign currency payment sweeps and documentary credit escrows through Banco Central de Cuba, Banco Financiero Internacional (BFI), and foreign correspondent banks."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and equitable receivership over commercial food procurement proceeds and bulk grain silo concessions."
