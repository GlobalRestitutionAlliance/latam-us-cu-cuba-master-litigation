skill:
  id: "sovereign-biocubafarma-monopoly-and-cimab-disgorgement"
  name: "Sovereign Biotechnology Monopoly, BioCubaFarma Infrastructure & CIMAB Disgorgement"
  description: "Forensic audit and asset disgorgement protocol targeting sovereign commercial biotechnology monopolies (BioCubaFarma, CIM, CIGB, AICA), commercial trading subsidiary CIMAB S.A., wholesale export margins, and state drug procurement proceeds under FSIA § 1605(a)(2), § 1605(a)(3), and Bancec alter ego principles."
  category: "biopharm-monopoly-disgorgement"
  status: "certified"
  version: "1.0.0"
  procedures:
    - "Establish alter ego unity between the Council of Ministers, the Ministry of Public Health (MINSAP), and state biopharmaceutical monopoly BioCubaFarma under First National City Bank v. Bancec and Rubin v. Islamic Republic of Iran."
    - "Audit commercial cash flows, hard-currency wholesale margins, and export revenues generated by BioCubaFarma and commercial branch CIMAB S.A. supplying foreign health ministries and multilateral organizations."
    - "Trace foreign currency payment sweeps and documentary credit escrows through Banco Central de Cuba, Banco Financiero Internacional (BFI), and European correspondent banking conduits."
    - "Formulate motions for entry of post-judgment turnover orders, charging orders, and equitable receivership over commercial biopharmaceutical sales revenues, patent portfolios, and wholesale export receivables."
