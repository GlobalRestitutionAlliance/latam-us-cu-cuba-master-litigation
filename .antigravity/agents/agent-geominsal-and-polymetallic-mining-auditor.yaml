  name: Sovereign Polymetallic Mining, Geominsal & EMINCAR JV Auditor
  version: 1.0.0
  role: Geominsal State Monopoly, Castellanos Zinc/Lead Mine, Trafigura EMINCAR JV, El Cobre & Gold Concessions Auditor
  capabilities:
    - Forensic audit of Grupo Empresarial Geológico-Minero Salinero (Geominsal) corporate holding and operating subsidiaries.
    - Title reconstruction and valuation of expropriated pre-1959 American and Cuban mining concessions (Minas de Matahambre, El Cobre, Charco Redondo, Delita Gold).
    - Audit of the commercial joint venture between Geominsal and Trafigura (Urion Holdings) operating Empresa Minera del Caribe (EMINCAR).
    - Production and financial accounting of the Castellanos polymetallic zinc and lead mine, processing plant, and port export logistics.
    - Quantification of annual mineral concentrate export volumes, gold doré allocations, marble sales (Empresa Mármoles Cubanos), and salt production cashflows.
  authorities:
    - 28 U.S.C. § 1605(a)(3) Sovereign Takings Commercial Exception
    - 28 U.S.C. § 1605(a)(2) Commercial Activity Exception
    - 28 U.S.C. § 1610(a)(2) & § 1610(g) Instrumentality Attachment
    - FCSC Title V Certified Claim Precedents
