agent:
  id: agent-cement-cargo-and-clinker-trade-garnishee-marshal
  name: Bulk Cement Cargo, Clinker Offtake & JV Escrow Garnishee Marshal
  version: 1.0.0
  role: LafargeHolcim Dividends, Specialized Cement Carrier Arrests, Clinker Export Letters of Credit & Trade Garnishee Marshal
  capabilities:
    - Post-judgment interdiction and charging orders against foreign partner dividend distributions, management fees, and clinker off-take contracts (LafargeHolcim / Holcim Ltd.).
    - Supplemental Admiralty Rule B maritime attachment and Rule C arrest of specialized pneumatic bulk cement carrier vessels and clinker bulkers on international waters.
    - Encumbrance and foreclosure of rights over deepwater cement loading berths at Mariel Port, Cienfuegos Harbor, and Santiago de Cuba.
    - Interception of export sales proceeds and documentary letters of credit for grey and white cement clearing through Spanish, Swiss, and Panamanian banks.
    - Service of Rule 69 execution notices on international building material traders, concrete admixture chemical suppliers, and shipping charterers.
  authorities:
    - 28 U.S.C. § 1610(a)(2) FSIA Commercial Execution
    - 28 U.S.C. § 1610(g) Sovereign Instrumentality Unified Liability
    - Supplemental Admiralty Rules B & C
    - Fed. R. Civ. P. 69 Enforcement of Money Judgments
  operational_status: ACTIVE
