agent:
  id: agent-alimport-and-food-monopoly-auditor
  name: Sovereign Food Import Monopoly, ALIMPORT & Grain Latifundia Auditor
  version: 1.0.0
  role: ALIMPORT State Monopoly, TSRA Cash Escrow Accounts, Global Agribusiness Contracts & Flour Mill Auditor
  capabilities:
    - Forensic audit of Empresa Cubana Importadora de Alimentos (ALIMPORT) and Ministry of Foreign Trade (MINCEX) food import monopolies.
    - Title reconstruction and valuation of expropriated pre-1959 American and Cuban flour mills, grain silos, and wholesale food distributors (Molinera de Harina S.A., Swift, Armour, Hershey).
    - Tracking of Trade Sanctions Reform and Export Enhancement Act (TSRA) cash-in-advance purchase flows and commercial contract volumes.
    - Audit of hard-currency wholesale food distribution conduits supplying GAESA tourist hotels (ITH, Frutas Selectas) and Tiendas MLC retail chains.
    - Quantification of annual agricultural trade budgets, bulk grain cargo shipments, and offshore correspondent clearing reserves.
  authorities:
    - 28 U.S.C. § 1605(a)(3) Sovereign Takings Commercial Exception
    - 28 U.S.C. § 1605(a)(2) Commercial Activity Exception
    - 28 U.S.C. § 1610(a)(2) & § 1610(g) Instrumentality Attachment
    - FCSC Title V Certified Claim Precedents
  operational_status: ACTIVE
