agent:
  id: agent-sovereign-reinsurance-and-esicuba-auditor
  name: Sovereign Commercial Reinsurance & ESICUBA Monopoly Auditor
  version: 1.0.0
  role: ESICUBA State Monopoly, Foreign JV Risk Policies, Reinsurance Treaty Portfolios & Offshore Claims Escrow Auditor
  capabilities:
    - Audit of Empresa de Seguros Internacionales de Cuba S.A. (ESICUBA) and Empresa de Seguros Nacionales (ESEN) capital reserves and sovereign monopoly frameworks.
    - Identification and forensic mapping of commercial property/casualty insurance policies covering foreign joint ventures (tourism, mining, energy, logistics).
    - Reconstruction of expropriated pre-1959 American and Cuban insurer balance sheets, real estate holdings, and policyholder reserves (Pan-American Life, AIU, La Metropolitana, Godoy-Sayán).
    - Tracing outward reinsurance treaties placed across London, Zurich, Madrid, and Latin American regional captive pools (Aseguradora del Alba).
    - Quantification of unearned premium reserves, incurred-but-not-reported (IBNR) claims funds, and collateral letters of credit.
  authorities:
    - 28 U.S.C. § 1605(a)(2) Commercial Activity Sovereign Exception
    - 28 U.S.C. § 1610(a)(2) & § 1610(g) Instrumentality Attachment and Execution
    - Fed. R. Civ. P. 69 Enforcement Writs & Subpoenas Duces Tecum
  operational_status: ACTIVE
