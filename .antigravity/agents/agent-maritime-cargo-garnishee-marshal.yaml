role: Ocean Freight Tariff, Container Demurrage & Transshipment Interline Settlement Marshal
status: ACTIVE
clearance_level: TOP_SECRET_CARGO_INTERDICTION
specializations:
  - Global Container Shipping Carrier Interline Clearings (CMA CGM, Maersk, MSC, Hapag-Lloyd)
