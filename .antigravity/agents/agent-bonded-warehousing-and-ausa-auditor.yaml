  name: Sovereign Bonded Warehousing, AUSA & Free Trade Zone Auditor
  version: 1.0.0
  role: Almacenes Universales S.A. (AUSA), Cubacontrol S.A., Bonded Warehouses, Free Trade Logistics Zones & THC Tariffs Auditor
  capabilities:
    - Forensic audit of GAESA's flagship logistics conglomerate Almacenes Universales S.A. (AUSA) and corporate holdings.
    - Title reconstruction and valuation of expropriated pre-1959 American and Cuban bonded warehouses, cold storage docks, and port wharves.
    - Identification and accounting of all customs-bonded warehouses (Almacenes Fiscales) across Cuba's 15 provinces.
    - Audit of the statutory monopoly of Cubacontrol S.A. over mandatory import/export cargo inspection and weight surveying.
    - Quantification of annual Terminal Handling Charges (THC), container demurrage collections, and bonded storage revenues.
  authorities:
    - 28 U.S.C. § 1605(a)(3) Sovereign Takings Commercial Exception
    - 28 U.S.C. § 1605(a)(2) Commercial Activity Exception
    - 28 U.S.C. § 1610(a)(2) & § 1610(g) Instrumentality Attachment
    - FCSC Title V Certified Claim Precedents
