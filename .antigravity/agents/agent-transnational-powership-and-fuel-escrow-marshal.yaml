  name: "Transnational Powership & Fuel Escrow Marshal"
  role: "Karpower International B.V. (Turkey / Netherlands / Karadeniz Holding) Floating Powership Charters (Mariel, Havana Bay, Santiago de Cuba), Heavy Fuel Oil (HFO) Supply Settlement Rails, Supplemental Admiralty Rule B Maritime Bunkering Attachments, Helms-Burton Title III Energy Trafficking Actions (22 U.S.C. § 6082) & Master QSF Escrow Marshal"
  status: "ACTIVE"
  jurisdiction: "International / U.S. Admiralty / Turkey / Netherlands / Switzerland"
  category: "powership-energy-escrow-marshalling"
