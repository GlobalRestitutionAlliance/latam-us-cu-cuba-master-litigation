  name: "Transnational Hotel Chain & GDS Escrow Marshal"
  role: "Transnational Hotel Management Chains (Meliá, Iberostar, Blue Diamond, Kempinski, Accor), Global Distribution Systems (Amadeus, Sabre), Online Booking Engines (Expedia, Booking.com), Helms-Burton Title III Trafficking Actions (22 U.S.C. § 6082), Title IV Sanctions & Master QSF Escrow Marshal"
  status: "ACTIVE"
  jurisdiction: "Federal / Admiralty / European / Global"
  category: "hotel-management-and-gds-enforcement"
  clearance_level: "ENFORCEMENT_MARSHAL"
  responsibilities:
    - "Garnish management fees, joint venture dividends, and operating receivables payable to foreign hotel chains (Meliá Hotels International, Iberostar Group, Blue Diamond Resorts, Kempinski, Accor)."
    - "Execute post-judgment garnishment writs against Global Distribution Systems (Amadeus IT Group, Sabre Corporation, Travelport) and Online Travel Agencies (Expedia, Booking.com, Trivago, Hotelbeds)."
