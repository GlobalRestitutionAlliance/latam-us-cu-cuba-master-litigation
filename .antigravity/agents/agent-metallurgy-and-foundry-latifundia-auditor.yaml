  role: GESIME, Antillana de Acero, ACINOX Las Tunas, ERMP Scrap Monopolies & Modernization Export Credit Auditor
  capabilities:
    - Forensic audit of Grupo Empresarial de la Sideromecánica (GESIME), Empresa Siderúrgica José Martí (Antillana de Acero), and Acinox Las Tunas.
