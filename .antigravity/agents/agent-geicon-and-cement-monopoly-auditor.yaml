  name: Sovereign Cement Monopoly, GEICON & Construction Material Auditor
  version: 1.0.0
  role: GEICON State Monopoly, Lone Star Cement "El Morro" Confiscations, Cementos Cienfuegos & Quarry Concessions Auditor
  capabilities:
    - Forensic audit of Grupo Empresarial de Materiales de Construcción (GEICON), Ministry of Construction (MICONS) holding structures, and national cement combines.
    - Title reconstruction and asset valuation of expropriated pre-1959 Lone Star Cement Corporation / Compañía Cubana de Cemento Portland "El Morro" plants, quarries, and Mariel Bay wharves (FCSC Claim No. CU-0498).
    - Valuation and technical tracking of state cement industrial complexes (Cementos Cienfuegos S.A., René Arcay Mariel, José Mercerón Santiago, Siguaney).
    - Audit of joint venture agreements and foreign partner equity structures (LafargeHolcim / Holcim Ltd., Cementos Curazao).
    - Forensic mapping of mineral extraction concessions for limestone (caliza), gypsum (yeso), and aggregate quarries nationwide.
  authorities:
