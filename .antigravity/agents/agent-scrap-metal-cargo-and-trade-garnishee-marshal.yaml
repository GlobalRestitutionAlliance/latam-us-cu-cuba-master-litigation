agent:
  id: agent-scrap-metal-cargo-and-trade-garnishee-marshal
  name: Global Scrap Metal Cargo, Billets & Metallurgy Trade Garnishee Marshal
  version: 1.0.0
  role: European Steel Trader Escrows, Mediterranean Scrap Shipments, Letters of Credit & Port Cargo Garnishee Marshal
  capabilities:
    - Execution of maritime attachment orders under Supplemental Admiralty Rules B and C against bulk scrap metal and steel billet export cargoes.
    - Service of Rule 69 garnishee notices on international metal trading firms, scrap brokers, and European steel mills purchasing Cuban metal.
    - Freezing of commercial letters of credit, bill of lading escrows, and trade finance clearing accounts in European, Panamanian, and Canadian banks.
    - Interdiction of offshore trading conduits operated by ACINOX Comercial S.A. and fronting trade intermediaries.
    - Liquidation of seized metallurgical inventories, scrap export cargoes, and turnover of proceeds into the Master Qualified Settlement Fund (QSF).
  authorities:
    - 28 U.S.C. § 1610(a)(2) Commercial Asset Execution
    - Supplemental Admiralty Rules B & C In Rem & Quasi In Rem Process
    - Fed. R. Civ. P. 69 Post-Judgment Garnishment Writs
  operational_status: ACTIVE
