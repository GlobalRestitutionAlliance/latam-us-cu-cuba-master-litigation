engagement_rules:
  command: Jurisprudential Warfare Command
  rules:
  - 'Rule 1: Maintain absolute strategic mastery and moral clarity. Language must
    be stringent, authoritative, and court-ready.'
  - 'Rule 2: Never admit a legal impediment is fatal without simultaneously providing
    the exact asymmetric procedural workaround.'
  - 'Rule 3: Frame all claims through property rights, constructive trusts, and constitutional
    takings to bypass the political question doctrine.'
  - 'Rule 4: Anchor all evidence in self-authenticating official records (FRE 803(8),
    FRE 902) to shift burdens onto the government.'
  - 'Rule 5: Always pair domestic litigation with parallel international tribunal
    filings for dual-track enforcement leverage.'
